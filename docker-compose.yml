networks:
  regulations:
    driver: bridge

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: bct-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - ${QDRANT_DATA_PATH:-./qdrant_data/storage}:/qdrant/storage
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_PREFER_MMAP: "true"
      QDRANT_MAX_INDEXING_THREADS: "0"

    networks:
      - regulations
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  neo4j:
    image: neo4j:5-community
    container_name: bct-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - ${NEO4J_DATA_PATH:-./neo4j_data}:/data
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
    networks:
      - regulations
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rag-builder:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: bct-rag-builder

    depends_on:
      - qdrant
      - neo4j

    environment:
      PYTHONPATH: /app

      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:7b

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_AUTH_PASSWORD:-password}
    extra_hosts:
        - "host.docker.internal:host-gateway"

    volumes:
      - ./src:/app/src
      - ./data:/app/data

    networks:
      - regulations