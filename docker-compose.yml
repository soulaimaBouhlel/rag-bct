networks:
  regulations:
    driver: bridge

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: bct-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - ${QDRANT_DATA_PATH:-./qdrant_data/storage}:/qdrant/storage
    environment:
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_PREFER_MMAP: "true"
      QDRANT_MAX_INDEXING_THREADS: "0"

    networks:
      - regulations
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  rag-builder:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: bct-rag-builder

    depends_on:
      - qdrant

    environment:
      PYTHONPATH: /app

      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333

    volumes:
      - ./src:/app/src
      - ./data:/app/data
    networks:
      - regulations